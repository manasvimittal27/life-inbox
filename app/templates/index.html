<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Inbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,550&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="empty-state">
  <div class="wrap">
    <header class="app-header">
      <div class="title-row">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1>Life Inbox</h1>
      </div>
      <p class="sub">Enter your thoughts — I’ll handle everything else.</p>
    </header>

    <section class="capture panel">
      <textarea id="noteText" placeholder="Enter your thoughts, I’ll handle everything else. Type, or press 🎤 Speak and talk."></textarea>
      <div class="capture-actions">
        <button id="micButton" type="button" onclick="toggleVoiceCapture()">🎤 Speak</button>
        <button id="addNoteButton" type="button" onclick="captureAndOrganize()">Add &amp; organize</button>
        <span class="upload-inline">
          <input type="file" id="fileInput" accept="image/*,application/pdf" />
          <button id="uploadButton" type="button" class="secondary" onclick="uploadFile()">Read file</button>
        </span>
        <span class="gmail-inline">
          <button id="gmailButton" type="button" class="secondary" onclick="gmailAction()">Connect Gmail</button>
        </span>
      </div>
      <p id="noteStatus" class="status muted" role="status" aria-live="polite"></p>
    </section>

    <div class="layout">
      <main class="main-col">
        <div class="day-nav">
          <button class="day-arrow" type="button" onclick="changeDay(-1)" aria-label="Previous day">&lsaquo;</button>
          <h2 id="dayLabel">Today</h2>
          <button class="day-arrow" type="button" onclick="changeDay(1)" aria-label="Next day">&rsaquo;</button>
        </div>
        <div id="thinking" class="thinking" hidden>
          <span class="dots animate" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>Organizing into P0 / P1 / P2…</span>
        </div>
        <p id="taskStatus" class="status muted" role="status" aria-live="polite"></p>
        <div id="dayView"></div>
      </main>

      <aside class="side-col">
        <section class="panel">
          <h3>Today’s time</h3>
          <label class="time-budget">
            Awake hours
            <input type="number" id="dayBudget" min="1" max="24" step="0.5" value="16" oninput="renderTimePie()" />
          </label>
          <div id="timePie"></div>
        </section>
        <section class="panel">
          <h3>Last week</h3>
          <div id="weekSummary"></div>
        </section>
      </aside>
    </div>

    <details class="raw-notes">
      <summary>Saved notes &amp; sources</summary>
      <form id="itemSearchForm" class="search-toolbar" onsubmit="applyItemFilters(event)">
        <label>
          Search
          <input id="itemSearch" type="search" maxlength="200" placeholder="Text or title" />
        </label>
        <label>
          Type
          <select id="itemTypeFilter">
            <option value="">All</option>
            <option value="text">Text</option>
            <option value="email">Email</option>
          </select>
        </label>
        <label>
          Category
          <select id="categoryFilter">
            <option value="">All</option>
          </select>
        </label>
        <label>
          Priority
          <select id="priorityFilter">
            <option value="">All</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </label>
        <label>
          Processing
          <select id="processingStatusFilter">
            <option value="">All</option>
            <option value="ready">Ready</option>
          </select>
        </label>
        <div class="search-actions">
          <button type="submit">Search</button>
          <button type="button" class="secondary" onclick="clearItemFilters()">Clear</button>
        </div>
      </form>
      <p id="searchStatus" class="status muted" role="status" aria-live="polite"></p>
      <div id="notes"></div>
    </details>
  </div>

  <div id="taskModalBackdrop" class="modal-backdrop" hidden onclick="onModalBackdropClick(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
      <h3 id="taskModalTitle">Edit task</h3>
      <label class="modal-field">
        Task
        <textarea id="editText" maxlength="500"></textarea>
      </label>
      <label class="modal-field">
        Bucket
        <select id="editBucket">
          <option value="P0">P0 — Urgent / deadline</option>
          <option value="P1">P1 — Important deep work</option>
          <option value="P2">P2 — Operational / hobby</option>
        </select>
      </label>
      <label class="modal-field">
        Type
        <select id="editType" onchange="onEditTypeChange()">
          <option value="one_off">One-off</option>
          <option value="recurring">Recurring</option>
        </select>
      </label>
      <label class="modal-field" id="editDueWrap">
        Due date
        <input type="date" id="editDue" />
      </label>
      <label class="modal-field" id="editRecurrenceWrap">
        Repeat
        <select id="editRecurrence">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
        </select>
      </label>
      <label class="modal-field modal-check">
        <input type="checkbox" id="editImportance" />
        Mark as crucial (high importance)
      </label>
      <label class="modal-field">
        Effort (minutes)
        <input type="number" id="editEffort" min="0" step="5" />
      </label>
      <div class="modal-actions">
        <button type="button" onclick="saveTaskEdit()">Save</button>
        <button type="button" class="secondary" onclick="closeTaskModal()">Cancel</button>
      </div>

      <div class="modal-progress">
        <h4>Progress (today)</h4>
        <label class="modal-field">
          Progress note
          <textarea id="editProgressNote" maxlength="1000" placeholder="e.g. Watched 3 DSA lectures"></textarea>
        </label>
        <label class="modal-field">
          % complete
          <input type="number" id="editProgressPct" min="0" max="100" step="5" />
        </label>
        <div class="modal-actions">
          <button type="button" class="secondary" onclick="logProgress()">Log progress</button>
        </div>
        <p class="muted small">Leave % blank to let AI estimate it from your note.</p>
      </div>
      <p id="editStatus" class="status muted" role="status" aria-live="polite"></p>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
